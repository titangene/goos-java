services:
  openfire:
    image: ghcr.io/igniterealtime/openfire:latest
    hostname: localhost
    ports:
      - "9090:9090"   # admin console（跑 setup wizard 用）
      - "5222:5222"   # 測試會用到的 XMPP client port
    volumes:
      - openfire-data:/var/lib/openfire

  toolbox:
    build:
      context: ..
      dockerfile: docker/toolbox.Dockerfile
    network_mode: "service:openfire"
    volumes:
      - ..:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # 讓容器內的 Swing app 顯示在主機的 X display
    working_dir: /app
    command: ["sleep", "infinity"]

volumes:
  openfire-data:
