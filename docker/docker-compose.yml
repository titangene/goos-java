services:
  openfire:
    image: ghcr.io/igniterealtime/openfire:latest
    hostname: localhost
    ports:
      - "9090:9090"   # admin console（跑 setup wizard 用）
      - "5222:5222"   # 測試會用到的 XMPP client port
      - "7070:7070"   # unencrypted BOSH / WebSocket（ws://.../ws/）
      - "7443:7443"   # encrypted BOSH / WebSocket（wss://.../ws/）
    volumes:
      - openfire-data:/var/lib/openfire

  # 用 network_mode: service:openfire，讓這個 container 裡的 "localhost" 直接
  # 打到 openfire -- 測試/production code 寫死 XMPP_HOSTNAME = "localhost"，
  # 這樣就不用改 source code。
  toolbox:
    build:
      context: ..
      dockerfile: docker/toolbox.Dockerfile
    network_mode: "service:openfire"
    volumes:
      - ..:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # 讓容器內的 Swing app 顯示在主機的 X display
    working_dir: /app
    command: ["sleep", "infinity"]

volumes:
  openfire-data:
